<div mat-dialog-title class="dialog-header">

  <h2 class="mb-0">
    Report Details
  </h2>

  <button
    mat-icon-button
    aria-label="Close dialog"
    (click)="closeDialog()">

    <mat-icon>close</mat-icon>

  </button>

</div>
<div mat-dialog-content>

  <img
    [src]="report.image"
    class="img-fluid rounded mb-3"
    alt="Report Image">

  <p>
    {{ report.description }}
  </p>

  <p>
    Reported by: {{ report.reported_by }}
  </p>

  <p>
    Status: {{ report.status }}
  </p>

    <div
    *ngIf="successMessage"
    class="alert alert-success">

    {{ successMessage }}

    </div>

    <div
    *ngIf="errorMessage"
    class="alert alert-danger">

    {{ errorMessage }}

    </div>

    <button
        *ngIf="!showDriveForm"
        class="btn btn-success w-100"
        (click)="openDriveForm()">
        Create Drive
    </button>

    <div *ngIf="showDriveForm">
        <hr>
        <h5>Create Cleanup Drive</h5>
        <form
            [formGroup]="driveForm"
            (ngSubmit)="onCreateDrive()">

            <div class="mb-3">

                <label class="form-label">
                Drive Description
                </label>

                <textarea
                rows="3"
                class="form-control"
                formControlName="description">
                </textarea>

            </div>

            <div class="mb-3">

                <label class="form-label">
                Scheduled At
                </label>

                <input
                type="datetime-local"
                class="form-control"
                formControlName="scheduled_at">

            </div>

            <button
            type="submit"
            class="btn btn-success"
            [disabled]="successMessage">

            Create Drive

            </button>

        </form>

    </div>
</div>
