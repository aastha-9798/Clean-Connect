<nav class="app-nav">
  <div class="nav-inner">

    <a class="brand" routerLink="/" (click)="menuOpen = false">
      <span class="brand-mark">
        <mat-icon>eco</mat-icon>
      </span>
      <span class="brand-name">Clean<span>Connect</span></span>
    </a>

    <button
      type="button"
      class="nav-toggle"
      aria-label="Toggle navigation"
      [attr.aria-expanded]="menuOpen"
      (click)="menuOpen = !menuOpen">
      <mat-icon>{{ menuOpen ? 'close' : 'menu' }}</mat-icon>
    </button>

    <div class="nav-links" [class.open]="menuOpen">

      <a
        class="nav-item"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="menuOpen = false">
        <mat-icon class="icon-sm">dynamic_feed</mat-icon>
        Feed
      </a>

      <!-- ng-container: like div but only used to group elements, doesnt show on browser -->
      <ng-container *ngIf="!authService.isLoggedIn()">

        <a
          class="nav-item"
          routerLink="/login"
          routerLinkActive="active"
          (click)="menuOpen = false">
          Log in
        </a>

        <a
          class="btn btn-primary btn-sm nav-cta"
          routerLink="/signup"
          (click)="menuOpen = false">
          Sign up
        </a>

      </ng-container>

      <ng-container *ngIf="authService.isLoggedIn()">

        <a
          class="nav-item"
          routerLink="/ai"
          routerLinkActive="active"
          (click)="menuOpen = false">
          <mat-icon class="icon-sm">smart_toy</mat-icon>
          AI Assistant
        </a>

        <a
          class="nav-item"
          routerLink="/profile"
          routerLinkActive="active"
          (click)="menuOpen = false">
          <mat-icon class="icon-sm">person</mat-icon>
          Profile
        </a>

        <a
          class="btn btn-primary btn-sm nav-cta"
          routerLink="/report"
          (click)="menuOpen = false">
          <mat-icon class="icon-sm">add_location_alt</mat-icon>
          Report Issue
        </a>

        <a
          class="nav-item nav-logout"
          href="#"
          (click)="menuOpen = false; logout()">
          <mat-icon class="icon-sm">logout</mat-icon>
          Log out
        </a>

      </ng-container>

    </div>

  </div>
</nav>
