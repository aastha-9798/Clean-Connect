<div class="chat-page">

  <div class="chat-panel cc-card">

    <header class="chat-header">
      <span class="avatar">
        <mat-icon>eco</mat-icon>
      </span>
      <div>
        <h1>CleanConnect Assistant</h1>
        <p>Ask about sorting, recycling or disposal — or share a photo of the waste.</p>
      </div>
    </header>

    <div class="messages" #chatContainer>

      <div class="chat-empty" *ngIf="messages.length === 0">
        <span class="avatar avatar-lg">
          <mat-icon class="icon-lg">smart_toy</mat-icon>
        </span>
        <h2>How can I help?</h2>
        <p>Try asking “Is a pizza box recyclable?” or attach a photo and ask how to dispose of it.</p>
      </div>

      <div
        *ngFor="let message of messages"
        class="message-row"
        [class.user-row]="message.role === 'user'"
        [class.assistant-row]="message.role === 'assistant'">

        <span class="avatar avatar-sm" *ngIf="message.role === 'assistant'">
          <mat-icon class="icon-sm">eco</mat-icon>
        </span>

        <div
          class="message-bubble"
          [class.user-bubble]="message.role === 'user'"
          [class.assistant-bubble]="message.role === 'assistant'">

          <img
            *ngIf="message.image"
            [src]="message.image"
            class="message-image"
            alt="Attached image">

          <span
            class="typing"
            *ngIf="message.role === 'assistant' && message.content === 'Thinking...'; else messageText"
            aria-label="Assistant is typing">
            <span></span><span></span><span></span>
          </span>

          <ng-template #messageText>
            <!-- the assistant's simple Markdown (bold, bullets) is shown formatted; the user's text stays as typed -->
            <p
              class="message-text"
              *ngIf="message.role === 'assistant'; else plainText"
              [innerHTML]="message.content | chatFormat"></p>
            <ng-template #plainText>
              <p class="message-text">{{ message.content }}</p>
            </ng-template>
          </ng-template>

        </div>

      </div>

    </div>

    <footer class="composer">

      <div
        class="image-preview"
        *ngIf="imagePreview">

        <img
          [src]="imagePreview"
          alt="Selected image">

        <button
          type="button"
          aria-label="Remove image"
          (click)="removeImage()">
          <mat-icon class="icon-sm">close</mat-icon>
        </button>

      </div>

      <div class="composer-bar">

        <label class="icon-btn" title="Attach an image">
          <mat-icon>add_photo_alternate</mat-icon>
          <input
            #fileInput
            type="file"
            accept="image/*"
            hidden
            (change)="onImageSelected($event)">
        </label>

        <textarea
          [(ngModel)]="message"
          rows="1"
          placeholder="Ask about waste management…"
          aria-label="Message"
          (keydown.enter)="onEnter($event)"></textarea>

        <button
          type="button"
          class="send-btn"
          aria-label="Send message"
          (click)="sendMessage()"
          [disabled]="isLoading">
          <mat-icon>send</mat-icon>
        </button>

      </div>

      <small class="composer-hint">Enter to send · Shift + Enter for a new line</small>

    </footer>

  </div>

</div>
