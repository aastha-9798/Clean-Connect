<div class="auth-page">

  <div class="auth-card cc-card">

    <div class="auth-brand">
      <mat-icon>eco</mat-icon>
    </div>

    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">
      Join your community in keeping neighbourhoods clean.
    </p>

    <div
      *ngIf="successMessage"
      class="alert alert-success">
      {{ successMessage }}
    </div>

    <div
      *ngIf="errorMessage"
      class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" novalidate>

      <div class="mb-3">
        <label class="form-label" for="signup-username">Username</label>
        <input
          id="signup-username"
          type="text"
          class="form-control"
          placeholder="How others will see you"
          autocomplete="username"
          formControlName="username"
          [class.is-invalid]="signupForm.controls.username.touched && signupForm.controls.username.invalid">
        <div class="invalid-feedback">
          Username is required.
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="signup-email">Email</label>
        <input
          id="signup-email"
          type="email"
          class="form-control"
          placeholder="you@example.com"
          autocomplete="email"
          formControlName="email"
          [class.is-invalid]="signupForm.controls.email.touched && signupForm.controls.email.invalid">
        <div class="invalid-feedback">
          Enter a valid email address.
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label" for="signup-password">Password</label>
        <input
          id="signup-password"
          type="password"
          class="form-control"
          placeholder="At least 6 characters"
          autocomplete="new-password"
          formControlName="password"
          [class.is-invalid]="signupForm.controls.password.touched && signupForm.controls.password.invalid">
        <div class="invalid-feedback">
          Password must be at least 6 characters.
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-lg w-100">
        Create account
      </button>

    </form>

    <p class="auth-switch">
      Already have an account?
      <a routerLink="/login">Log in</a>
    </p>

  </div>

</div>
