<div class="auth-page">

  <div class="auth-card cc-card">

    <div class="auth-brand">
      <mat-icon>eco</mat-icon>
    </div>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">
      Log in to report issues and join cleanup drives near you.
    </p>

    <div
      *ngIf="successMessage"
      class="alert alert-success">
      {{ successMessage }}
    </div>

    <div
      *ngIf="errorMessage"
      class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

      <div class="mb-3">
        <label class="form-label" for="login-email">Email</label>
        <input
          id="login-email"
          type="email"
          class="form-control"
          placeholder="you@example.com"
          autocomplete="email"
          formControlName="email"
          [class.is-invalid]="loginForm.controls.email.touched && loginForm.controls.email.invalid">
        <div class="invalid-feedback">
          Enter a valid email address.
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label" for="login-password">Password</label>
        <input
          id="login-password"
          type="password"
          class="form-control"
          placeholder="Your password"
          autocomplete="current-password"
          formControlName="password"
          [class.is-invalid]="loginForm.controls.password.touched && loginForm.controls.password.invalid">
        <div class="invalid-feedback">
          Password must be at least 6 characters.
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-lg w-100">
        Log in
      </button>

    </form>

    <p class="auth-switch">
      Don't have an account?
      <a routerLink="/signup">Sign up</a>
    </p>

  </div>

</div>
