<div class="container mt-4">

  <div class="card">

    <div class="card-body">

      <h2>Login</h2>

      <div
        *ngIf="successMessage"
        class="alert alert-success">

        {{ successMessage }}

      </div>

      <div
        *ngIf="errorMessage"
        class="alert alert-danger">

        {{ errorMessage }}

      </div>
      
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            formControlName="email">
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            formControlName="password">
        </div>

        <button
          type="submit"
          class="btn btn-primary">
          Login
        </button>

      </form>
        
    </div>

  </div>

</div>
