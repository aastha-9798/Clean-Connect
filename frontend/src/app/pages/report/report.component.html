<div class="page page-narrow">

  <header class="page-header">
    <h1>Report an issue</h1>
    <p>Share photos and the exact location of the waste problem so your community can act on it.</p>
  </header>

  <div class="cc-card report-card">

    <div
      *ngIf="errorMessage"
      class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <div
      *ngIf="successMessage"
      class="alert alert-success">
      {{ successMessage }}
    </div>

    <form [formGroup]="reportForm" (ngSubmit)="onSubmit()">

      <section class="form-section">

        <h2 class="form-section__title">
          <span class="step">1</span>
          Add photos
          <span class="photo-limit">{{ selectedImages.length }} / {{ maxImages }}</span>
        </h2>

        <label class="upload-zone" *ngIf="selectedImages.length === 0">

          <input
            type="file"
            class="visually-hidden"
            accept="image/*"
            multiple
            (change)="onFileSelected($event)">

          <span class="upload-icon">
            <mat-icon>add_a_photo</mat-icon>
          </span>
          <strong>Click to upload photos</strong>
          <span class="upload-hint">Up to {{ maxImages }} photos · JPEG, PNG or WEBP · 5 MB each</span>

        </label>

        <div class="photo-grid" *ngIf="selectedImages.length > 0">

          <div
            *ngFor="let image of selectedImages; let i = index"
            class="photo-tile">

            <img
              *ngIf="image.preview"
              [src]="image.preview"
              [alt]="'Selected photo ' + (i + 1)">

            <span class="cover-badge" *ngIf="i === 0">Cover</span>

            <button
              type="button"
              class="photo-remove"
              [attr.aria-label]="'Remove photo ' + (i + 1)"
              (click)="removeImage(i)">
              <mat-icon class="icon-sm">close</mat-icon>
            </button>

          </div>

          <label class="photo-tile photo-add" *ngIf="selectedImages.length < maxImages">
            <input
              type="file"
              class="visually-hidden"
              accept="image/*"
              multiple
              (change)="onFileSelected($event)">
            <mat-icon>add_photo_alternate</mat-icon>
            <span>Add more</span>
          </label>

        </div>

      </section>

      <section class="form-section">

        <h2 class="form-section__title">
          <span class="step">2</span>
          Location
        </h2>

        <button
          type="button"
          class="btn btn-outline-primary mb-3"
          (click)="getLocation()">
          <mat-icon class="icon-sm">my_location</mat-icon>
          Use current location
        </button>

        <div class="row g-3">

          <div class="col-6">
            <label class="form-label" for="report-latitude">Latitude</label>
            <input
              id="report-latitude"
              class="form-control"
              placeholder="—"
              formControlName="latitude"
              readonly>
          </div>

          <div class="col-6">
            <label class="form-label" for="report-longitude">Longitude</label>
            <input
              id="report-longitude"
              class="form-control"
              placeholder="—"
              formControlName="longitude"
              readonly>
          </div>

        </div>

      </section>

      <section class="form-section">

        <h2 class="form-section__title">
          <span class="step">3</span>
          Describe the problem
        </h2>

        <textarea
          rows="4"
          class="form-control"
          placeholder="e.g. Overflowing garbage near the bus stop on MG Road"
          formControlName="description">
        </textarea>

      </section>

      <button
        type="submit"
        class="btn btn-primary btn-lg w-100">
        <mat-icon class="icon-sm">send</mat-icon>
        Submit report
      </button>

    </form>

  </div>

</div>
