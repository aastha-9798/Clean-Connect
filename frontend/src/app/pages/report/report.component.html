<div class="page page-narrow">

  <header class="page-header">
    <h1>Report an issue</h1>
    <p>Share a photo and the exact location of the waste problem so your community can act on it.</p>
  </header>

  <div class="cc-card report-card">

    <div
      *ngIf="errorMessage"
      class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <div
      *ngIf="successMessage"
      class="alert alert-success">
      {{ successMessage }}
    </div>

    <form [formGroup]="reportForm" (ngSubmit)="onSubmit()">

      <section class="form-section">

        <h2 class="form-section__title">
          <span class="step">1</span>
          Add a photo
        </h2>

        <label class="upload-zone" [class.has-image]="imagePreview">

          <input
            type="file"
            class="visually-hidden"
            accept="image/*"
            (change)="onFileSelected($event)">

          <ng-container *ngIf="!imagePreview">
            <span class="upload-icon">
              <mat-icon>add_a_photo</mat-icon>
            </span>
            <strong>Click to upload a photo</strong>
            <span class="upload-hint">JPEG, PNG or WEBP · up to 5 MB</span>
          </ng-container>

          <ng-container *ngIf="imagePreview">
            <img
              [src]="imagePreview"
              alt="Preview of the selected photo">
            <span class="upload-change">
              <mat-icon class="icon-sm">swap_horiz</mat-icon>
              Change photo
            </span>
          </ng-container>

        </label>

      </section>

      <section class="form-section">

        <h2 class="form-section__title">
          <span class="step">2</span>
          Location
        </h2>

        <button
          type="button"
          class="btn btn-outline-primary mb-3"
          (click)="getLocation()">
          <mat-icon class="icon-sm">my_location</mat-icon>
          Use current location
        </button>

        <div class="row g-3">

          <div class="col-6">
            <label class="form-label" for="report-latitude">Latitude</label>
            <input
              id="report-latitude"
              class="form-control"
              placeholder="—"
              formControlName="latitude"
              readonly>
          </div>

          <div class="col-6">
            <label class="form-label" for="report-longitude">Longitude</label>
            <input
              id="report-longitude"
              class="form-control"
              placeholder="—"
              formControlName="longitude"
              readonly>
          </div>

        </div>

      </section>

      <section class="form-section">

        <h2 class="form-section__title">
          <span class="step">3</span>
          Describe the problem
        </h2>

        <textarea
          rows="4"
          class="form-control"
          placeholder="e.g. Overflowing garbage near the bus stop on MG Road"
          formControlName="description">
        </textarea>

      </section>

      <button
        type="submit"
        class="btn btn-primary btn-lg w-100">
        <mat-icon class="icon-sm">send</mat-icon>
        Submit report
      </button>

    </form>

  </div>

</div>
